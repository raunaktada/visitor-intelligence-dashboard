version: '3.8'

services:
  backend:
    build: .
    ports:
      - "5000:5000"
    env_file: .env
    volumes:
      - ./credentials.json:/app/credentials.json:ro
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./client:/app
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000
    command: sh -c "npm install && npm start"
    depends_on:
      - backend
